name: Build Holoscan MEP recorder

on: workflow_dispatch

jobs:
  build_holoscan_mep_recorder:
    name: "Build holoscan-mep-recorder"
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up CUDA DEB repo
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/arm64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
      - name: Install dependencies
        run: |
          sudo apt-get install -y cuda-toolkit holoscan=2.5.0.1-1 libhdf5-dev
      - name: Run build
        run: |
          ./run build holoscan-mep-recorder --buildpath build --configure-args "-DCMAKE_CUDA_ARCHITECTURES=87 -DCMAKE_VERBOSE_MAKEFILE=OFF -DHOLOHUB_DOWNLOAD_DATASETS=OFF" --type release
      - name: Upload DEB package artifact
        uses: actions/upload-artifact@v4
        with:
          name: holoscan-mep-recorder-deb
          path: holoscan-mep-recorder_*.deb
